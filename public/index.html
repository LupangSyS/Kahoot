<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join the game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button class="lang" data-toggle-lang data-i18n="lang"></button>
  <main id="app">
    <section id="v-join" class="view active center">
      <div class="brand"><img data-theme-logo hidden alt=""><div class="ev" data-theme-text="eventName" hidden></div><div class="sub" data-theme-text="subtitle" hidden></div></div>
      <h1 class="logo" id="default-logo">Quizzo!</h1>
      <form id="join-form" class="card">
        <input id="pin" class="center-in" inputmode="numeric" maxlength="6" data-i18n-ph="pin" autocomplete="off" required>
        <input id="nick" class="center-in" maxlength="20" data-i18n-ph="nick" autocomplete="off" required>
        <button class="btn primary" type="submit" data-i18n="enter"></button>
        <p class="error" id="join-error"></p>
      </form>
    </section>

    <section id="v-wait" class="view center">
      <div class="brand"><img data-theme-logo hidden alt=""><div class="ev" data-theme-text="eventName" hidden></div></div>
      <h2 id="wait-title"></h2>
      <p class="big" id="wait-name"></p>
      <p class="hint" id="wait-msg"></p>
    </section>

    <section id="v-answer" class="view">
      <header class="bar"><span id="pq-count"></span><div class="timer" id="pq-timer"></div><span id="pq-score"></span></header>
      <div class="choices player" id="pq-choices"></div>
    </section>

    <section id="v-slide" class="view center">
      <h2 data-i18n="look_screen"></h2>
      <p class="big" id="slide-text"></p>
    </section>

    <section id="v-result" class="view center">
      <h1 id="res-title"></h1>
      <p class="big" id="res-gain"></p>
      <p id="res-rank"></p>
      <p class="hint" id="res-streak"></p>
    </section>

    <section id="v-end" class="view center">
      <h1 data-i18n="game_over"></h1>
      <p class="big" id="pe-rank"></p>
      <p id="pe-score"></p>
      <button class="btn primary" id="pe-again" data-i18n="play_again"></button>
    </section>
    <div id="toast" hidden></div>
  </main>
  <canvas id="confetti"></canvas>
  <script src="/socket.io/socket.io.js"></script>
  <script src="common.js"></script>
  <script src="player.js"></script>
</body>
</html>
